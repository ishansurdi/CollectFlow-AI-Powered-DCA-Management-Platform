services:
  - type: web
    name: collectflow-backend
    env: python
    runtime: python-3.10.13

    buildCommand: pip install --upgrade pip setuptools wheel && pip install --only-binary=:all: -r backend/requirements.txt || pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production

    healthCheckPath: /integration/health

  - type: static
    name: collectflow-frontend
    buildCommand: echo "No build needed"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
